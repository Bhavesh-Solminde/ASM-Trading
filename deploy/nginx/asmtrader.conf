# indianxtrade.com — host nginx site (installed to /etc/nginx/sites-available/).
# Coexists with /etc/nginx/sites-available/amscoins.conf; each block
# is selected by server_name, so requests never cross.
#
# The on-disk filename and internal label `asmtrader` are preserved as the
# server-side identifier for this stack (compose project, image tag, deploy
# directory) — the user-visible brand is IndianxTrade, served at
# indianxtrade.com.
#
# Canonical hostname is the apex `indianxtrade.com`. Every alternative
# hostname this stack owns — the old brand (asmtrader.com), the alt
# spelling (indiaxtrade.com), and `www.` for all three — is 301'd to it, so
# search engines index one URL and users land on one name.
#
# Install:
#   sudo cp deploy/nginx/asmtrader.conf /etc/nginx/sites-available/asmtrader.conf
#   sudo ln -s /etc/nginx/sites-available/asmtrader.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then (one certbot run covers every hostname):
#   sudo certbot --nginx \
#     -d indianxtrade.com -d www.indianxtrade.com \
#     -d indiaxtrade.com -d www.indiaxtrade.com \
#     -d asmtrader.com -d www.asmtrader.com \
#     --redirect
# certbot rewrites this file in place to add the ssl_certificate lines and
# a :443 block with an http->https redirect — that's expected.

# Rate-limit zone is per-server, so give it a unique name (amscoins uses `api`).
limit_req_zone $binary_remote_addr zone=asmtrader_api:10m rate=10r/s;

# Map for the WebSocket upgrade header — required by /ws.
map $http_upgrade $asmtrader_connection {
    default upgrade;
    ''      close;
}

# Permanent 301 for every alternative hostname → canonical apex. After
# certbot runs this gets duplicated into a :443 block with SSL; the two
# together give both http://<alt> and https://<alt> a single-hop redirect
# to https://indianxtrade.com.
server {
    listen 80;
    listen [::]:80;
    server_name www.indianxtrade.com
                indiaxtrade.com www.indiaxtrade.com
                asmtrader.com www.asmtrader.com;
    return 301 https://indianxtrade.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name indianxtrade.com;

    # Next.js — the whole site is dynamic, so no root/try_files.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next occasionally uses HMR/streaming — allow WS upgrades on all paths.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $asmtrader_connection;
        proxy_read_timeout 60s;
    }

    # Path-based API rate limiting — same shape as amscoins.
    location /api/ {
        limit_req zone=asmtrader_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Engine WebSocket — nginx bridges browser wss to loopback plain ws.
    location /ws {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $asmtrader_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets are long-lived by design — bump both timeouts.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

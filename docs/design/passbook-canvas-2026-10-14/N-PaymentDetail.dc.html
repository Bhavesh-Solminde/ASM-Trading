<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Withdrawal detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400..700&amp;family=Anek+Latin:wdth,wght@75..125,300..700&amp;family=Martian+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#06080b}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #06080b; color: #edf1f6; font-family: 'Anek Latin', 'Anek Devanagari', system-ui, sans-serif; font-size: 15px; line-height: 1.35; overflow: hidden">
  <div aria-hidden="true" style="padding: 44px 20px 0; opacity: 0.4">
    <div style="font-size: 26px; font-weight: 620">History</div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.62)"></div>

  <section aria-label="Withdrawal detail" style="position: absolute; left: 0; right: 0; bottom: 0; height: 690px; box-sizing: border-box; border-radius: 22px 22px 0 0; border-top: 1px solid #252d39; background: #0f141b; display: flex; flex-direction: column">
    <div style="width: 40px; height: 5px; border-radius: 4px; background: #252d39; margin: 10px auto 6px"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 20px 10px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 620">Withdrawal</h2>
      <span style="padding: 2px 6px; border: 1.5px solid #86a6ff; outline: 1px solid #86a6ff; outline-offset: 2px; border-radius: 3px; color: #86a6ff; font: 600 10px 'Martian Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase">Processing</span>
    </div>
    <div style="padding: 0 20px; display: flex; flex-direction: column">
      <span style="font: 600 34px 'Martian Mono', monospace; letter-spacing: -0.05em">₹5,000.00</span>
      <span style="font-size: 14px; color: #a6b0be">To asha.rao@okhdfcbank</span>
    </div>

    <ol style="list-style: none; margin: 0; padding: 24px 20px 0; display: flex; flex-direction: column">
      <li style="display: flex; gap: 14px">
        <span style="display: flex; flex-direction: column; align-items: center"><span style="width: 14px; height: 14px; border-radius: 50%; background: #2ecf7a"></span><span style="width: 2px; height: 44px; background: #2ecf7a"></span></span>
        <span style="display: flex; flex-direction: column; margin-top: -4px"><span style="font-weight: 600; font-size: 16px">Requested</span><span style="font: 400 12px 'Martian Mono', monospace; color: #737d8c">12 Oct, 14:02</span></span>
      </li>
      <li style="display: flex; gap: 14px">
        <span style="display: flex; flex-direction: column; align-items: center"><span style="width: 14px; height: 14px; border-radius: 50%; background: #2ecf7a"></span><span style="width: 2px; height: 44px; background: #252d39"></span></span>
        <span style="display: flex; flex-direction: column; margin-top: -4px"><span style="font-weight: 600; font-size: 16px">Approved</span><span style="font: 400 12px 'Martian Mono', monospace; color: #737d8c">12 Oct, 16:40</span></span>
      </li>
      <li style="display: flex; gap: 14px">
        <span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 2px solid #86a6ff"></span>
        <span style="display: flex; flex-direction: column; margin-top: -4px"><span style="font-weight: 600; font-size: 16px">Paid</span><span style="font-size: 13px; color: #737d8c">Usually within [YOUR PAYOUT TIME]</span></span>
      </li>
    </ol>

    <div style="padding: 24px 20px 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 12px; font-size: 15px">
      <span style="color: #737d8c">Reference</span><span style="text-align: right; font: 400 14px 'Martian Mono', monospace">W-58213</span>
      <span style="color: #737d8c">Method</span><span style="text-align: right">UPI ID</span>
    </div>

    <div style="margin-top: auto; padding: 12px 20px 28px">
      <button type="button" style="width: 100%; height: 52px; border-radius: 12px; border: 1px solid #252d39; background: transparent; color: #ff7468; font: 600 16px 'Anek Latin', sans-serif">Cancel withdrawal</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

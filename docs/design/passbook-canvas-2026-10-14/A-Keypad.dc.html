<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amount keypad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400..700&amp;family=Anek+Latin:wdth,wght@75..125,300..700&amp;family=Martian+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#06080b}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #06080b; color: #edf1f6; font-family: 'Anek Latin', 'Anek Devanagari', system-ui, sans-serif; font-size: 15px; line-height: 1.35; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 40px; width: 390px; height: 300px">
    <sc-for list="{{ bg }}" as="c" hint-placeholder-count="40">
      <div style="position: absolute; left: {{c.x}}px; top: {{c.wt}}px; width: 1px; height: {{c.wh}}px; background: {{c.col}}"></div>
      <div style="position: absolute; left: {{c.bx}}px; top: {{c.bt}}px; width: {{c.bw}}px; height: {{c.bh}}px; background: {{c.col}}"></div>
    </sc-for>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.62)"></div>

  <section aria-label="Amount" style="position: absolute; left: 0; right: 0; bottom: 0; height: 680px; box-sizing: border-box; border-radius: 22px 22px 0 0; border-top: 1px solid #252d39; background: #0f141b; display: flex; flex-direction: column">
    <div style="width: 40px; height: 5px; border-radius: 4px; background: #252d39; margin: 10px auto 6px"></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 4px 20px 10px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 620">Amount</h2>
      <span style="font-size: 14px; color: #737d8c">Demo account</span>
    </div>
    <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 4px">
      <span style="font: 600 46px 'Martian Mono', monospace; letter-spacing: -0.05em">₹ 2,500</span>
      <span style="border-top: 1px dashed #252d39; padding-top: 6px; font-size: 16px; color: #a6b0be">Two thousand five hundred rupees only</span>
    </div>
    <div style="display: flex; gap: 8px; padding: 16px 20px 0">
      <button type="button" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #252d39; background: transparent; color: #a6b0be; font: 500 14px 'Martian Mono', monospace; letter-spacing: -0.03em">₹100</button>
      <button type="button" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #252d39; background: transparent; color: #a6b0be; font: 500 14px 'Martian Mono', monospace; letter-spacing: -0.03em">₹500</button>
      <button type="button" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #252d39; background: transparent; color: #a6b0be; font: 500 14px 'Martian Mono', monospace; letter-spacing: -0.03em">₹1,000</button>
      <button type="button" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #edf1f6; background: #edf1f6; color: #06080b; font: 600 14px 'Martian Mono', monospace; letter-spacing: -0.03em">₹2,500</button>
      <button type="button" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #252d39; background: transparent; color: #a6b0be; font: 500 14px 'Martian Mono', monospace; letter-spacing: -0.03em">₹5,000</button>
    </div>
    <div style="display: flex; justify-content: space-between; padding: 16px 20px 12px; font-size: 15px">
      <span style="color: #a6b0be">If you win (93%)</span>
      <span style="font: 600 15px 'Martian Mono', monospace; color: #2ecf7a; letter-spacing: -0.02em">₹4,825.00</span>
    </div>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #1a212b">
      <button type="button" style="border: 0; border-bottom: 1px solid #1a212b; background: transparent; color: #edf1f6; font: 500 27px 'Anek Latin', sans-serif">1</button>
      <button type="button" style="border: 0; border-bottom: 1px solid #1a212b; border-left: 1px solid #1a212b; border-right: 1px solid #1a212b; background: transparent; color: #edf1f6; font: 500 27px 'Anek Latin', sans-serif">2</button>
      <button type="button" style="border: 0; border-bottom: 1px solid #1a212b; background: transparent; color: #edf1f6; font: 500 27px 'Anek Latin', sans-serif">3</button>
      <button type="button" style="border: 0; border-bottom: 1px solid #1a212b; background: transparent; color: #edf1f6; font: 500 27px 'Anek Latin', sans-serif">4</button>
      <button type="button" style="border: 0; border-bottom: 1px solid #1a212b; border-left: 1px solid #1a212b; border-right: 1px solid #1a212b; background: transparent; color: #edf1f6; font: 500 27px 'Anek Latin', sans-serif">5</button>
      <button type="button" style="border: 0; border-bottom: 1px solid #1a212b; background: transparent; color: #edf1f6; font: 500 27px 'Anek Latin', sans-serif">6</button>
      <button type="button" style="border: 0; border-bottom: 1px solid #1a212b; background: transparent; color: #edf1f6; font: 500 27px 'Anek Latin', sans-serif">7</button>
      <button type="button" style="border: 0; border-bottom: 1px solid #1a212b; border-left: 1px solid #1a212b; border-right: 1px solid #1a212b; background: transparent; color: #edf1f6; font: 500 27px 'Anek Latin', sans-serif">8</button>
      <button type="button" style="border: 0; border-bottom: 1px solid #1a212b; background: transparent; color: #edf1f6; font: 500 27px 'Anek Latin', sans-serif">9</button>
      <button type="button" style="border: 0; border-bottom: 1px solid #1a212b; background: transparent; color: #737d8c; font: 500 27px 'Anek Latin', sans-serif">.</button>
      <button type="button" style="border: 0; border-bottom: 1px solid #1a212b; border-left: 1px solid #1a212b; border-right: 1px solid #1a212b; background: transparent; color: #edf1f6; font: 500 27px 'Anek Latin', sans-serif">0</button>
      <button type="button" aria-label="Delete digit" style="border: 0; border-bottom: 1px solid #1a212b; background: transparent; color: #a6b0be; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"></path><path d="m12 9 6 6"></path><path d="m18 9-6 6"></path></svg></button>
    </div>
    <div style="padding: 12px 20px 24px">
      <button type="button" style="width: 100%; height: 54px; border-radius: 12px; border: 0; background: #edf1f6; color: #06080b; font: 600 17px 'Anek Latin', sans-serif">Done</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"chartSeed":{"editor":"int","default":3,"min":1,"max":60},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  bg(seed, w, h, n) {
    let s = seed * 9301 + 49297;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    let p = 100;
    const d = [];
    for (let i = 0; i < n; i++) { const o = p; const c = o + (r() - 0.5) * 2.4 + Math.sin(i / 9 + seed) * 0.35; d.push({ o: o, c: c, h: Math.max(o, c) + r() * 1.1, l: Math.min(o, c) - r() * 1.1 }); p = c; }
    let lo = Infinity, hi = -Infinity;
    d.forEach(function (k) { lo = Math.min(lo, k.l); hi = Math.max(hi, k.h); });
    const y = function (v) { return 20 + (hi - v) / (hi - lo) * (h - 34); };
    const step = w / n, bw = Math.max(2, step * 0.6);
    return d.map(function (k, i) {
      const x = i * step + step / 2;
      return { x: (x - 0.5).toFixed(1), bx: (x - bw / 2).toFixed(1), bw: bw.toFixed(1), wt: y(k.h).toFixed(1), wh: (y(k.l) - y(k.h)).toFixed(1), bt: y(Math.max(k.o, k.c)).toFixed(1), bh: Math.max(1, Math.abs(y(k.o) - y(k.c))).toFixed(1), col: k.c >= k.o ? '#2ecf7a' : '#ff7468' };
    });
  }
  renderVals() { return { bg: this.bg(this.props.chartSeed ?? 3, 390, 300, 44) }; }
}
</script>
</body>
</html>

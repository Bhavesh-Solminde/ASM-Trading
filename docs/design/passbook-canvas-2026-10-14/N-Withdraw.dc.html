<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 32px; display: flex; flex-direction: column; background: #06080b; color: #edf1f6; font-family: 'Anek Latin', 'Anek Devanagari', system-ui, sans-serif; font-size: 15px; line-height: 1.35; overflow: hidden">

    <span style="font: 600 42px 'Martian Mono', monospace; letter-spacing: -0.05em">₹ 5,000</span>

    <span style="padding-top: 4px; font-size: 13px; color: #737d8c">₹700 to ₹50,000 per withdrawal</span>

    <div style="position: relative">
      <input id="upiId" type="text" value="asha.rao@okhdfcbank" style="width: 100%; height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #252d39; background: #0f141b; color: #edf1f6; padding: 0 44px 0 14px; font: 400 16px 'Anek Latin', sans-serif">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2ecf7a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 14px; top: 16px"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"></path><path d="m9 12 2 2 4-4"></path></svg>

  <div style="padding: 0 20px 28px">
    <button type="button" style="width: 100%; height: 54px; border-radius: 12px; border: 0; background: {{accent}}; color: #ffffff; font: 600 17px 'Anek Latin', sans-serif">Withdraw ₹5,000</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3f6ff2","options":["#3f6ff2","#2f81f7","#ff9933","#1f9a12"]},"$preview":{"width":390,"height":844}}'>

}
</script>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3f6ff2","options":["#3f6ff2","#2f81f7","#ff9933","#1f9a12"]},"chartSeed":{"editor":"int","default":3,"min":1,"max":60},"bullPose":{"editor":"enum","default":"B3 bust","options":["B1 head-on","B2 leap","B3 bust","B4 rearing"],"section":"Up / Down buttons"},"bearPose":{"editor":"enum","default":"R1 swipe","options":["R1 swipe","R2 bust","R3 prowl","R4 pounce"],"section":"Up / Down buttons"},"beastBlend":{"editor":"enum","default":"overlay","options":["overlay","soft-light","screen","normal"],"section":"Up / Down buttons"},"beastOpacity":{"editor":"range","default":0.75,"min":0,"max":1,"step":0.05,"section":"Up / Down buttons"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  chart(seed, w, h, top, n) {
    let s = seed * 9301 + 49297;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    let p = 100;
    const d = [];
    for (let i = 0; i < n; i++) {
      const o = p;
      const c = o + (r() - 0.5) * 2.4 + Math.sin(i / 9 + seed) * 0.35;
      d.push({ o: o, c: c, h: Math.max(o, c) + r() * 1.1, l: Math.min(o, c) - r() * 1.1 });
      p = c;
    }
    let lo = Infinity, hi = -Infinity;
    d.forEach(function (k) { lo = Math.min(lo, k.l); hi = Math.max(hi, k.h); });
    const y = function (v) { return top + (hi - v) / (hi - lo) * (h - top - 14); };
    const step = w / n, bw = Math.max(2, step * 0.6);
    const candles = d.map(function (k, i) {
      const x = i * step + step / 2;
      return {
        x: (x - 0.5).toFixed(1), bx: (x - bw / 2).toFixed(1), bw: bw.toFixed(1),
        wt: y(k.h).toFixed(1), wh: (y(k.l) - y(k.h)).toFixed(1),
        bt: y(Math.max(k.o, k.c)).toFixed(1), bh: Math.max(1, Math.abs(y(k.o) - y(k.c))).toFixed(1),
        col: k.c >= k.o ? '#2ecf7a' : '#ff7468'
      };
    });
    const ly = y(d[n - 1].c), ei = n - 9, ey = y(d[ei].c), ex = ei * step + step / 2;
    return {
      candles: candles, lastY: ly.toFixed(1), lastTag: (ly - 11).toFixed(1),
      entryX: ex.toFixed(1), entryW: (w - ex).toFixed(1), entryY: ey.toFixed(1),
      entryDot: (ex - 4).toFixed(1), entryDotY: (ey - 4).toFixed(1), entryTag: (ey - 11).toFixed(1)
    };
  }
  renderVals() {
    // Engraved poses: image plus where it sits in the 62px button (bulls hang from the top, bears stand on the bottom).
    const bulls = {
      'B1 head-on': { src: '/_blob/b1d42f7ae22163486c1e87ef007551b3', h: 86, r: 4, t: -10 },
      'B2 leap': { src: '/_blob/db441175d68cca8945a16f03d4891804', h: 80, r: -2, t: -8 },
      'B3 bust': { src: '/_blob/546c8b56a4498f5d7373702ecfc9b839', h: 88, r: -4, t: -8 },
      'B4 rearing': { src: '/_blob/7eeebad2d24305038d3d1579d39fc4e1', h: 96, r: 8, t: -12 }
    };
    const bears = {
      'R1 swipe': { src: '/_blob/93906df2a5f21946cbfb1e9bf0884851', h: 84, r: -2, b: -6 },
      'R2 bust': { src: '/_blob/81c534d5044686c7181ea18ec795e0e4', h: 74, r: -6, b: -6 },
      'R3 prowl': { src: '/_blob/cd1963b96d81b3897d5b619f6c49055d', h: 66, r: -4, b: -4 },
      'R4 pounce': { src: '/_blob/40ec20ab92b4bd4aaec9578aba9f4474', h: 86, r: 2, b: -4 }
    };
    return {
      accent: this.props.accent ?? '#3f6ff2',
      beastOpacity: this.props.beastOpacity ?? 0.75,
      beastBlend: this.props.beastBlend ?? 'overlay',
      bull: bulls[this.props.bullPose ?? 'B3 bust'] || bulls['B3 bust'],
      bear: bears[this.props.bearPose ?? 'R1 swipe'] || bears['R1 swipe'],
      ch: this.chart(this.props.chartSeed ?? 3, 330, 440, 60, 44)
    };
  }
}
</script>

# Deploys indianxtrade.com on every push to main.
# Mirrors the asmcoins pipeline: a validation gate, then an ssh-driven
# deploy. All work on the VPS runs as the `deploy` user; docker compose
# rebuilds only the app image (postgres/redis keep their volumes).

name: deploy indianxtrade.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A second push while a deploy is running cancels the queued one, so
  # only the newest main ever ships.
  group: deploy-asmtrader
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps (skip mobile app)
        # `--filter !@asm/relay...` avoids installing Expo/React Native
        # toolchain that this workflow does not deploy. `!@asm/mobile` has no
        # trailing `...` on purpose: that would also exclude @asm/client-core
        # and @asm/contracts, which web and the typecheck step need.
        run: pnpm install --frozen-lockfile --filter '!@asm/relay...' --filter '!@asm/mobile'

      - name: Generate Prisma client
        # pnpm v10 silently skips the @asm/db postinstall `prisma generate` hook
        # unless the package is in `onlyBuiltDependencies`, so the typecheck
        # step below sees stale generated types and fails on symbols that only
        # exist after a fresh schema generate. Running it explicitly here is
        # cheap (~100ms) and unblocks the deploy.
        run: pnpm --filter @asm/db exec prisma generate

      - name: Typecheck the deployed packages
        run: |
          pnpm --filter @asm/web --filter @asm/engine \
               --filter @asm/db --filter @asm/config \
               --filter @asm/contracts --filter @asm/logger \
               --filter @asm/market-sim \
               --filter @asm/algo --filter @asm/pricing \
               --filter @asm/trading --filter @asm/client-core --filter @asm/notify \
               exec tsc --noEmit

      - name: Check leaderboard preview and live modes
        run: |
          pnpm --filter @asm/db exec vitest run src/repositories/demo-leaderboard.test.ts src/repositories/leaderboard-columns.test.ts
          pnpm --filter @asm/web exec vitest run src/lib/leaderboard.test.ts

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is not needed; a shallow clone speeds up rsync input.
          fetch-depth: 1

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan exits non-zero when the VPS is slow to answer (e.g.
          # mid-build from the previous deploy) — retry before giving up.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts \
               && [ -s ~/.ssh/known_hosts ]; then
              exit 0
            fi
            echo "ssh-keyscan attempt $i failed, retrying in 10s"
            sleep 10
          done
          exit 1

      - name: Decide which containers to recreate
        id: scope
        # Recreating the engine pauses trading for ~15 s, so a website-only
        # change leaves it running (deploy/scripts/deploy-scope.sh). The diff is
        # against the last commit that deployed successfully. A manual run, an
        # unknown previous deploy or any git error recreates both.
        run: |
          scope=all
          if [ "${{ github.event_name }}" = "push" ]; then
            prev=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              'cat /opt/asmtrader/.deployed-sha 2>/dev/null' || true)
            if [[ "$prev" =~ ^[0-9a-f]{40}$ ]] && git fetch -q --depth=1 origin "$prev"; then
              scope=$(git diff --name-only "$prev" HEAD | deploy/scripts/deploy-scope.sh)
            fi
          fi
          echo "Recreating: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Rsync source to VPS
        # --delete mirrors the repo, so anything on the VPS that git doesn't track is
        # removed unless it is listed in deploy/rsync-excludes.txt (an exclude also
        # protects the file on the VPS). That list keeps the nightly pg_dumps in
        # /backups/; until 2026-11-21 every deploy deleted every dump.
        run: |
          rsync -avz --delete --exclude-from=deploy/rsync-excludes.txt \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/asmtrader/

      - name: Rebuild and restart containers
        # `up web` still builds the image and runs `migrate` (web depends on
        # it) but never touches the engine, which keeps its current image.
        run: |
          services=""
          if [ "${{ steps.scope.outputs.scope }}" = "web" ]; then services="web"; fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'bash -o pipefail -c "cd /opt/asmtrader/deploy && docker compose --env-file ../.env.production up -d --build '"$services"' 2>&1 | tail -40"'

      # Nginx changes are rare and involve the host config, which the deploy
      # user is not sudoered to `cp` into — those go through the manual
      # runbook in deploy/DEPLOY.md.

      - name: Smoke test
        run: |
          # Next.js takes a while to boot after the container restarts, and
          # nginx answers 502 until it does — poll for up to ~2 minutes
          # instead of a fixed sleep.
          # Canonical host must answer 200.
          for i in $(seq 1 24); do
            canonical=$(curl -s -o /dev/null -w "%{http_code}" https://indianxtrade.com)
            echo "indianxtrade.com (attempt $i): $canonical"
            [ "$canonical" = "200" ] && break
            sleep 5
          done
          if [ "$canonical" != "200" ]; then exit 1; fi

      - name: Record the deployed commit
        # Read by the next deploy to decide whether the engine must restart.
        # Written only after the smoke test, so a failed deploy is diffed again.
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'echo ${{ github.sha }} > /opt/asmtrader/.deployed-sha'

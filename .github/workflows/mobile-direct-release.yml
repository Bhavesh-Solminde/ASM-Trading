name: publish website Android app
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in apps/mobile/package.json
        required: true
        type: string
      mode:
        description: Build a signed candidate, or activate the already-tested candidate
        required: true
        default: build
        type: choice
        options: [build, publish]
permissions:
  contents: write
concurrency:
  group: mobile-direct-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare owner signing and deployment credentials
        env:
          DIRECT_KEY: ${{ secrets.DIRECT_KEYSTORE_B64 }}
          GS_DIRECT: ${{ secrets.GOOGLE_SERVICES_DIRECT_B64 }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$DIRECT_KEY" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/mobile-keys" "$RUNNER_TEMP/mobile-out" ~/.ssh
          printf '%s' "$DIRECT_KEY" | base64 -d > "$RUNNER_TEMP/mobile-keys/direct.p12"
          if [[ -n "$GS_DIRECT" ]]; then
            printf '%s' "$GS_DIRECT" | base64 -d > "$RUNNER_TEMP/mobile-keys/gs-direct.json"
          fi
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/mobile-keys/deploy"
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Prepare first-release storage
        if: inputs.mode == 'build'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$RUNNER_TEMP/mobile-keys/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'docker run --rm --pull=never --user 0:0 --entrypoint chown \
            -v /srv/app/releases:/releases asmtrader-app:latest "$(id -u):$(id -g)" /releases'
      - name: Test, sign, verify and upload website APK
        if: inputs.mode == 'build'
        env:
          APP_RELEASE_VARIANT: direct
          APP_KEYS_DIR: ${{ runner.temp }}/mobile-keys
          APP_RELEASE_OUT_DIR: ${{ runner.temp }}/mobile-out
          APP_RELEASE_UPLOAD: "1"
          APP_API_URL: https://indianxtrade.com
          APP_WS_URL: wss://indianxtrade.com/ws
          DIRECT_STORE_PASSWORD: ${{ secrets.DIRECT_KEYSTORE_PASSWORD }}
          DIRECT_KEY_ALIAS: ${{ secrets.DIRECT_KEY_ALIAS }}
          DIRECT_KEY_PASSWORD: ${{ secrets.DIRECT_KEY_PASSWORD }}
          APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.APP_GOOGLE_WEB_CLIENT_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_FILE: ${{ runner.temp }}/mobile-keys/deploy
        run: scripts/app-release.sh build "$RELEASE_VERSION"
      - name: Record release artifacts
        if: inputs.mode == 'build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-direct-v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ runner.temp }}/mobile-out/*.apk
            ${{ runner.temp }}/mobile-out/*.sha256
      - name: Load tested candidate checksum
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "app-direct-v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "indianxtrade-$RELEASE_VERSION.apk.sha256" --dir "$RUNNER_TEMP/mobile-out"
      - name: Activate verified download
        if: inputs.mode == 'publish'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          checksum=$(cut -d ' ' -f 1 "$RUNNER_TEMP/mobile-out/indianxtrade-$RELEASE_VERSION.apk.sha256")
          [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]
          ssh -i "$RUNNER_TEMP/mobile-keys/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- $RELEASE_VERSION $checksum" <<'REMOTE'
          set -euo pipefail
          version="$1"; checksum="$2"
          cd /srv/app/releases
          echo "$checksum  indianxtrade-$version.apk" | sha256sum -c -
          python3 - "$version" <<'PY'
          from pathlib import Path
          import os, re, sys, tempfile
          version = sys.argv[1]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version)
          env = Path('/opt/asmtrader/.env.production')
          original = env.read_text()
          lines = [line for line in original.splitlines() if not line.startswith('APP_LATEST_VERSION=')]
          lines.append('APP_LATEST_VERSION=' + version)
          fd, temporary = tempfile.mkstemp(dir=env.parent, prefix='.env-release-')
          try:
              with os.fdopen(fd, 'w') as handle:
                  handle.write('\n'.join(lines) + '\n')
              os.chmod(temporary, env.stat().st_mode & 0o777)
              os.replace(temporary, env)
          finally:
              if os.path.exists(temporary): os.unlink(temporary)
          PY
          cd /opt/asmtrader/deploy
          docker compose --env-file ../.env.production up -d --force-recreate web
          REMOTE
      - name: Verify public APK and checksum
        if: inputs.mode == 'publish'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location https://indianxtrade.com/download/app \
              -o "$RUNNER_TEMP/download.apk"; then break; fi
            sleep 5
          done
          expected=$(cut -d ' ' -f 1 "$RUNNER_TEMP/mobile-out/indianxtrade-$RELEASE_VERSION.apk.sha256")
          echo "$expected  $RUNNER_TEMP/download.apk" | sha256sum -c -
          curl --fail --silent --show-error "https://indianxtrade.com/download/app/$RELEASE_VERSION/checksum" \
            | grep -F "$expected"
      - name: Remove private signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/mobile-keys"

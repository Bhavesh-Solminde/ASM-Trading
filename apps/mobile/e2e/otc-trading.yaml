# Continue after login-trade with local dummy funds; never run against a funded production account.
appId: com.indianxtrade.app
---
- tapOn: { id: "expiry-tile" }
- tapOn: { id: "expiry-300" }
- extendedWaitUntil:
    visible: { id: "buy", enabled: true }
    timeout: 30000
- tapOn: { id: "buy" }
- extendedWaitUntil:
    visible: "History · 1"
    timeout: 15000
- tapOn: { id: "buy" }
- extendedWaitUntil:
    visible: "History · 2"
    timeout: 15000
- extendedWaitUntil:
    visible: { id: "sell", enabled: true }
    timeout: 15000
- tapOn: { id: "sell" }
- extendedWaitUntil:
    visible: "History · 3"
    timeout: 15000
- takeScreenshot: simultaneous-trades
- runFlow:
    when:
      visible: { id: "protection-toggle", checked: false }
    commands:
      - tapOn: { id: "protection-toggle" }
- assertVisible: { id: "protection-toggle", checked: true }
- tapOn: { id: "buy" }
- extendedWaitUntil:
    visible: { id: "trade-stops-set" }
    timeout: 15000
- assertVisible: "History · 4"
- assertVisible: { id: "chart-sl" }
- assertVisible: { id: "chart-tp" }
- takeScreenshot: protection-draft
- swipe:
    from: { id: "chart-sl" }
    direction: DOWN
    duration: 500
- tapOn: { id: "trade-stops-set" }
- extendedWaitUntil:
    visible: { id: "trade-stops-remove" }
    timeout: 15000
- takeScreenshot: protection-active
- swipe:
    from: { id: "chart-tp" }
    direction: UP
    duration: 500
- tapOn: { id: "trade-stops-update" }
- extendedWaitUntil:
    visible: { id: "trade-stops-remove" }
    timeout: 15000
- tapOn: { id: "chart-tp-remove" }
- extendedWaitUntil:
    notVisible: { id: "chart-tp" }
    timeout: 15000
- assertVisible: { id: "chart-sl" }
- tapOn: { id: "trade-stops-remove" }
- extendedWaitUntil:
    visible: { id: "trade-stops-add" }
    timeout: 15000
- assertNotVisible: { id: "chart-sl" }
- tapOn: "5m"
- assertVisible: { id: "displayed-price", text: "[0-9].*" }
- takeScreenshot: five-minute-chart
- tapOn: "1m"
- tapOn: { id: "chart-fullscreen" }
- assertNotVisible: { id: "stake-tile" }
- takeScreenshot: fullscreen
- tapOn: { id: "chart-fullscreen" }
- assertVisible: { id: "stake-tile" }
